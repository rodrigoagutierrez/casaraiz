name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZmFrZQ
      CLERK_SECRET_KEY: sk_test_ZmFrZQ
      STRIPE_SECRET_KEY: sk_test_ZmFrZQ
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ZmFrZQ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
