<svg xmlns="http://www.w3.org/2000/svg" viewBox="150 105 200 200">
  <defs>
    <!-- Gradiente de transición natural en la base de la casa hacia la raíz -->
    <linearGradient id="houseToRoot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#083253" />
      <stop offset="100%" stop-color="#BC5F1A" />
    </linearGradient>
  </defs>

  <!-- ESTRUCTURA DE LA CASA (Azul Mar - #083253) -->
  <g id="house-structure">
    <!-- Techo y paredes de línea curva fluida -->
    <path d="M 210 165 L 250 125 L 290 165 M 218 157 L 218 205 C 218 215 225 218 235 218 L 260 218 C 275 218 282 210 282 195 L 282 157"
          fill="none"
          stroke="#083253"
          stroke-width="11"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Ventana cuadrícula (4 paneles) -->
    <rect x="238" y="166" width="10" height="10" rx="1.5" fill="#083253" />
    <rect x="252" y="166" width="10" height="10" rx="1.5" fill="#083253" />
    <rect x="238" y="180" width="10" height="10" rx="1.5" fill="#083253" />
    <rect x="252" y="180" width="10" height="10" rx="1.5" fill="#083253" />
  </g>

  <!-- SISTEMA DE RAÍCES ORGANICAS (Naranja Otoño - #BC5F1A) -->
  <g id="tree-roots" stroke="#BC5F1A" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Raíz principal central -->
    <path d="M 250 218 Q 250 240 248 265 Q 246 280 250 295" stroke-width="8" />
    <path d="M 248 265 Q 240 280 235 292" stroke-width="4.5" />
    <path d="M 250 275 Q 258 288 262 298" stroke-width="4.5" />

    <!-- Raíz principal izquierda -->
    <path d="M 235 218 Q 220 230 205 240 Q 192 248 180 252" stroke-width="7" />
    <path d="M 212 235 Q 200 250 192 265" stroke-width="5" />
    <path d="M 200 250 Q 188 262 182 272" stroke-width="3.5" />
    <path d="M 225 225 Q 222 248 215 262 T 212 285" stroke-width="5.5" />

    <!-- Raíz principal derecha -->
    <path d="M 265 218 Q 280 230 295 240 Q 308 248 320 252" stroke-width="7" />
    <path d="M 288 235 Q 300 250 308 265" stroke-width="5" />
    <path d="M 300 250 Q 312 262 318 272" stroke-width="3.5" />
    <path d="M 275 225 Q 278 248 285 262 T 288 285" stroke-width="5.5" />
  </g>

  <!-- TIPOGRAFÍA Y MARCA -->
  <g id="brand-text">
    <!-- "Casa" en Azul Mar (#083253) -->
    <text x="145" y="360"
          fill="#083253"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-weight="700"
          font-size="50"
          letter-spacing="-0.5">Casa</text>

    <!-- "Raíz" en Naranja Otoño (#BC5F1A) -->
    <text x="262" y="360"
          fill="#BC5F1A"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-weight="700"
          font-size="50"
          letter-spacing="-0.5">Raíz</text>

    <!-- Detalle de hoja sobre la í -->
    <path d="M 326 316 C 322 310 328 304 333 307 C 336 310 332 317 326 316 Z" fill="#BC5F1A" />
  </g>
</svg>
