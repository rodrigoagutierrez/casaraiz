<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <!-- Background Gradient / Soft Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FAE7D3" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F2F7FB" stop-opacity="0"/>
    </radialGradient>

    <style>
      .house-stroke { fill: none; stroke: #083253; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
      .house-fill { fill: #083253; }
      .root-stroke { fill: none; stroke: #BC5F1A; stroke-linecap: round; stroke-linejoin: round; }
      .text-casa { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 700; fill: #083253; font-size: 42px; letter-spacing: -0.5px; }
      .text-raiz { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 700; fill: #BC5F1A; font-size: 42px; letter-spacing: -0.5px; }
      .accent-leaf { fill: #BC5F1A; }
    </style>
  </defs>

  <!-- Background Soft Aura -->
  <circle cx="250" cy="220" r="180" fill="url(#bgGlow)"/>

  <!-- Minimalist Roof & House Outline (Mar-900: #083253) -->
  <path class="house-stroke" d="M 150,210 L 250,110 L 350,210" />

  <!-- Right wall continuous line transitioning down -->
  <path class="house-stroke" d="M 330,190 L 330,230 C 330,235 325,240 320,240 L 180,240 C 175,240 170,235 170,230 L 170,190" />

  <!-- Inner Minimal Window Structure -->
  <rect x="235" y="150" width="30" height="30" fill="none" stroke="#083253" stroke-width="5" rx="2" />
  <line x1="250" y1="150" x2="250" y2="180" stroke="#083253" stroke-width="4" />
  <line x1="235" y1="165" x2="265" y2="165" stroke="#083253" stroke-width="4" />

  <!-- Soil / Transition Line -->
  <path class="house-stroke" d="M 140,240 L 360,240" stroke-width="7" />

  <!-- Organic Modern Roots (Naranja Otoño-600: #BC5F1A) -->
  <!-- Central Main Root -->
  <path class="root-stroke" d="M 250,240 C 250,270 240,295 250,320 C 255,335 250,345 245,355" stroke-width="7" />
  <path class="root-stroke" d="M 247,285 C 262,300 272,315 270,330" stroke-width="5" />

  <!-- Left Branching Roots -->
  <path class="root-stroke" d="M 205,240 C 200,265 185,285 170,300" stroke-width="6" />
  <path class="root-stroke" d="M 195,265 C 205,285 210,305 205,325" stroke-width="5" />
  <path class="root-stroke" d="M 178,292 C 170,305 160,315 150,320" stroke-width="4" />

  <!-- Right Branching Roots -->
  <path class="root-stroke" d="M 295,240 C 300,265 315,285 330,300" stroke-width="6" />
  <path class="root-stroke" d="M 305,265 C 295,285 290,305 295,325" stroke-width="5" />
  <path class="root-stroke" d="M 322,292 C 330,305 340,315 350,320" stroke-width="4" />

  <!-- Typography: CasaRaíz -->
  <g transform="translate(135, 415)">
    <text class="text-casa" x="0" y="0">Casa</text>
    <text class="text-raiz" x="105" y="0">Raíz</text>

    <!-- Leaf accent over the 'í' dot -->
    <path class="accent-leaf" d="M 194.5, -42 C 192, -49 198, -52 201, -49 C 203, -46 200, -40 194.5, -42 Z" />
  </g>
</svg>
